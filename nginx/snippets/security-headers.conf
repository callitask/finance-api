# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - Reusable NGINX security headers snippet for proxied locations.
#  *
#  * Scope:
#  * - Included via `include /etc/nginx/snippets/security-headers.conf;` in every proxied location block of nginx/conf.d/default.conf.
#  *
#  * Security Constraints:
#  * - Emits only hardened headers via `add_header ... always;` inside location context.
#  *
#  * IMMUTABLE CHANGE HISTORY:
#  * - ADDED (P1.3 - Global /auth/ Login DoS Fix):
#  * • Created the snippet; mounted read-only on the `nginx` service in docker-compose.yml + docker-compose.oci.yml.
#  * • Included it in every proxied location block of default.conf to cure Nginx's silent `add_header` inheritance drop.
#  */
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
