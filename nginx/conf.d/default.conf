# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - NGINX reverse proxy configuration for shielding internal services and handling routing.
#  *
#  * Scope:
#  * - Proxies traffic to backend APIs and Keycloak IAM.
#  * - Executes Lua-based AEGIS edge-security modules (JA3 fingerprinting).
#  *
#  * Critical Dependencies:
#  * - Backend: relies on http://backend:8080
#  * - Keycloak: relies on http://keycloak:8080
#  *
#  * Security Constraints:
#  * - X-Forwarded headers must be explicitly declared for Keycloak to trust the proxy.
#  * - Strict Content-Security-Policy enforcement.
#  *
#  * Change Intent:
#  * - Refactored to support OpenResty Lua execution and strip legacy ModSecurity rules.
#  *
#  * IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#  * - EDITED (Current Phase): 
#  * • Added `proxy_hide_header X-Frame-Options;` to `/auth/` and `/auth/resources/` blocks.
#  * • Why: Keycloak emits its own strict `SAMEORIGIN` header natively, blocking the frontend from embedding the `silent-check-sso.html` iframe regardless of frontend CSP. Stripping it delegates iframe security entirely to the Next.js boundary CSP.
#  * - EDITED (Phase 3 - SEC-03 Fix):
#  * • Declared `limit_req_zone` blocks at the top of the file mapping binary IPs.
#  * • Applied `limit_req zone=keycloak_auth burst=3 nodelay;` strictly inside `location /auth/`.
#  * - EDITED (Login 429/400 Hotfix):
#  * • Added dedicated `location /auth/resources/` block to bypass rate limiting for Keycloak static assets (CSS/JS/images).
#  * • Relaxed `keycloak_auth` zone from `rate=5r/m burst=3` to `rate=20r/m burst=15`.
#  *
#  * - EDITED (HTTPS Required / Issuer Mismatch Fix):
#  * • Replaced `proxy_set_header X-Forwarded-Proto $scheme;` with `proxy_set_header X-Forwarded-Proto https;` across all location blocks.
#  * • Why: Cloudflare Tunnel terminates SSL and hits Nginx on port 80. `$scheme` was passing `http` to Keycloak, triggering its strict "HTTPS required" block and generating invalid `http://` JWT issuers that the Spring backend rejected, crashing the React UI.
#  *
#  * - EDITED (Login Loop / CSP Fix):
#  * • Added `proxy_hide_header Content-Security-Policy;` to `/auth/` and `/auth/resources/` blocks.
#  * • Why: Keycloak 25 natively emits a strict `frame-ancestors 'self'` CSP header that overrides the Nginx proxy CSP, completely blocking the React frontend (`treishvaamfinance.com`) from loading the `silent-check-sso.html` iframe. This resulted in an infinite authentication loop and "Init Blocked/Timeout" degradation.
#  * - EDITED (Phase 6 - Architecture Upgrades):
#  * • Added `proxy_set_header X-Request-ID $request_id;` and `add_header X-Request-ID $request_id always;` to all backend proxy locations (ARCH-04).
#  * • Why: Enables distributed tracing across Nginx, Spring Boot MDC, and downstream services.
#  *
#  * - EDITED (AEGIS Phase 1):
#  * • Stripped legacy ModSecurity directives to transition to OpenResty.
#  * • Injected lua_package_path and aegis_ja3.lua logic to extract TLS JA3 and Real IP.
#  * • Replaced static $remote_addr with dynamic $real_client_ip from Lua.
#  */

lua_package_path "/etc/nginx/lua/?.lua;;";
lua_shared_dict aegis_deception 10m;

map $http_origin $cors_origin {
    default "";
    "~^https://(www\.)?treishvaamfinance\.com$"              $http_origin;
    "~^https://(www\.)?treishvaamgroup\.com$"                $http_origin;
    "~^https://(www\.)?treishvaamagro\.com$"                 $http_origin;
    "~^https://treishfin\.treishvaamgroup\.com$"             $http_origin;
    "http://localhost:3000"                                  $http_origin;
}

# --- RATE LIMITING ZONES (SEC-03 & SEC-02 Edge Foundation) ---
limit_req_zone $binary_remote_addr zone=keycloak_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_read:50m rate=100r/m;

server {
    listen 80;
    listen [::]:80;
    server_name backend.treishvaamgroup.com;

    # AEGIS: Dynamic Fingerprinting and IP Extraction via Lua
    set_by_lua_block $ja3_hash {
        local ja3 = require "aegis_ja3"
        return ja3.get_fingerprint()
    }
    set_by_lua_block $real_client_ip {
        local ja3 = require "aegis_ja3"
        return ja3.get_real_ip()
    }

    # ----------------------------------------------------------------------
    # 0. GLOBAL SETTINGS & SECURITY SHIELD
    # ----------------------------------------------------------------------
    client_max_body_size 100M;       
    client_header_buffer_size 64k;   
    large_client_header_buffers 4 64k;

    # 🛡️ SECURITY HEADERS (Global Secure Baseline)
    server_tokens off; 
    
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; connect-src 'self' backend.treishvaamgroup.com https:; media-src 'self' https:; frame-src 'self' https:; object-src 'none'; frame-ancestors 'self' https://treishfin.treishvaamgroup.com https://treishvaamfinance.com https://www.treishvaamfinance.com http://localhost:3000; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Content-Type-Options "nosniff" always; 

    # ----------------------------------------------------------------------
    # 1. Backend Robots.txt
    # ----------------------------------------------------------------------
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /";
    }

    # ----------------------------------------------------------------------
    # 1.5. Favicon Silent Drop (Prevent 500 Errors)
    # ----------------------------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # ----------------------------------------------------------------------
    # 2. Keycloak Proxy - STATIC ASSETS BYPASS
    # ----------------------------------------------------------------------
    location /auth/resources/ {
        proxy_pass http://keycloak:8080/auth/resources/;

        # --- FIX: Prevent Keycloak from emitting SAMEORIGIN which breaks silent-check-sso iframe ---
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Cache-Control "public, max-age=31536000, immutable";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;
        
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ----------------------------------------------------------------------
    # 2.1 Keycloak Proxy - CORE AUTH ENDPOINTS
    # ----------------------------------------------------------------------
    location /auth/ {
        # SEC-03: Rate Limit Login Attempts
        limit_req zone=keycloak_auth burst=15 nodelay;
        limit_req_status 429;
        
        proxy_pass http://keycloak:8080/auth/;

        # --- FIX: Prevent Keycloak from emitting SAMEORIGIN which breaks silent-check-sso iframe ---
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # --- FIX: Relax CSP for Keycloak Admin Console (React Import Maps require unsafe-inline) ---
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; connect-src 'self' backend.treishvaamgroup.com https:; media-src 'self' https:; frame-src 'self' https:; object-src 'none'; frame-ancestors 'self' https://treishfin.treishvaamgroup.com https://treishvaamfinance.com https://www.treishvaamfinance.com http://localhost:3000; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Content-Type-Options "nosniff" always;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header X-RateLimit-Limit 20 always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ----------------------------------------------------------------------
    # 3. Uploads Handling
    # ----------------------------------------------------------------------
    location /uploads/ {
        rewrite ^/uploads/(.*) /api/uploads/$1 last;
    }

    location /api/v1/uploads/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://backend:8080;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS, POST, PUT, DELETE, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    }

    location /api/uploads/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/api/uploads/(.*) /api/v1/uploads/$1 break;
        proxy_pass http://backend:8080;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    }

    # ----------------------------------------------------------------------
    # 4. Observability (GA4 / Analytics)
    # ----------------------------------------------------------------------
    location /api/v1/monitoring/ingest {
        proxy_pass http://backend:8080/api/v1/monitoring/ingest;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header X-Visitor-City $http_x_visitor_city;
        proxy_set_header X-Visitor-Region $http_x_visitor_region;
        proxy_set_header X-Visitor-Country $http_x_visitor_country;
        proxy_set_header X-Visitor-Device-Colo $http_x_visitor_device_colo;
        proxy_set_header User-Agent $http_user_agent;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    }

    # ----------------------------------------------------------------------
    # 4.1 Market Data Specific
    # ----------------------------------------------------------------------
    location ~ ^/api/v1/market/(data|quote)/ {
        proxy_pass http://backend:8080;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;
        
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    # ----------------------------------------------------------------------
    # 4.5 Bulk Delete
    # ----------------------------------------------------------------------
    location ~ ^/api/v1/posts/bulk {
        proxy_pass http://backend:8080;
        
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    # ----------------------------------------------------------------------
    # 5. Draft Management
    # ----------------------------------------------------------------------
    location ~ ^/api/v1/posts/draft {
        proxy_pass http://backend:8080;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    # ----------------------------------------------------------------------
    # 5.1 Admin Post Management
    # ----------------------------------------------------------------------
    location ~ ^/api/v1/posts/admin {
        proxy_pass http://backend:8080;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    # ----------------------------------------------------------------------
    # 5.2 File Uploads
    # ----------------------------------------------------------------------
    location ~ ^/api/v1/files {
        proxy_pass http://backend:8080;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        client_max_body_size 50M;
    }

    # ----------------------------------------------------------------------
    # 5.3 Post Management
    # ----------------------------------------------------------------------
    location ~ ^/api/v1/posts {
        proxy_pass http://backend:8080; 

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    # ----------------------------------------------------------------------
    # 6. Auth & Profile Management
    # ----------------------------------------------------------------------
    location ~ ^/api/v1/auth {
        proxy_pass http://backend:8080;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    # ----------------------------------------------------------------------
    # 7. Backend API Proxy (Catch All)
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://backend:8080/;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-JA3-Fingerprint $ja3_hash;

        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header X-Visitor-City $http_x_visitor_city;
        proxy_set_header X-Visitor-Region $http_x_visitor_region;
        proxy_set_header X-Visitor-Country $http_x_visitor_country;
        proxy_set_header User-Agent $http_user_agent;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}