# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - NGINX reverse proxy configuration for shielding internal services and handling routing.
#  *
#  * Scope:
#  * - ModSecurity WAF enforcement.
#  * - Proxies traffic to backend APIs and Keycloak IAM.
#  *
#  * Critical Dependencies:
#  * - Backend: relies on http://backend:8080
#  * - Keycloak: relies on http://keycloak:8080
#  *
#  * Security Constraints:
#  * - X-Forwarded headers must be explicitly declared for Keycloak to trust the proxy.
#  * - Strict Content-Security-Policy enforcement.
#  *
#  * Non-Negotiables:
#  * - ModSecurity must be disabled on specific routes (e.g., auth, posts) to prevent false positives.
#  *
#  * Change Intent:
#  * - Disable ModSecurity on /auth/ to prevent 403 Forbidden blocks when saving configurations in Keycloak Admin Console.
#  *
#  * Future AI Guidance:
#  * - Keycloak 22+ requires strict trailing slashes on proxy_pass in this specific setup to prevent OIDC URI mismatch errors.
#  *
#  * IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#  * - EDITED:
#  * • Modified `location /auth/` to `location /auth` and removed trailing slash from `proxy_pass http://keycloak:8080;`.
#  * • Added `X-Forwarded-Host $host;` and `X-Forwarded-Port 443;` for Keycloak 23+ edge compatibility.
#  * • Why: Keycloak was dropping connections (502) or generating malformed redirect URIs because edge origin context was lost.
#  *
#  * - EDITED:
#  * • Reverted location path back to `location /auth/` and `proxy_pass http://keycloak:8080/auth/;`.
#  * • Why: The removal of the trailing slashes caused Keycloak to break internally. Restored the exact pathing while maintaining the new `X-Forwarded` edge headers.
#  *
#  * - EDITED:
#  * • Added `location = /favicon.ico` block with a `return 204`.
#  * • Why: The frontend implicitly requests /favicon.ico from the auth domain during SSO flows, which caused the backend to throw a 500 Error. Silent drop mitigates this.
#  *
#  * - EDITED:
#  * • Added `modsecurity off;` to the `location /auth/` block.
#  * • Why: Keycloak Admin Console `PUT` requests (like saving client redirect URIs) were being falsely flagged as XSS/Injection attacks by OWASP CRS Paranoia Level 1, resulting in 403 Forbidden errors. Keycloak handles its own internal input validation safely.
#  */

server {
    listen 80;
    listen [::]:80;
    server_name backend.treishvaamgroup.com;

    # ----------------------------------------------------------------------
    # 0. GLOBAL SETTINGS & SECURITY SHIELD
    # ----------------------------------------------------------------------
    client_max_body_size 100M;       
    client_header_buffer_size 64k;   
    large_client_header_buffers 4 64k;
    http2_max_field_size 64k;
    http2_max_header_size 64k;

    # 🛡️ SECURITY HEADERS (Fort Knox - Updated for Silent SSO)
    server_tokens off; # Hide Nginx version
    
    # [FIXED] Replaced X-Frame-Options with CSP to allow Frontend SSO Frames
    add_header Content-Security-Policy "frame-ancestors 'self' https://treishfin.treishvaamgroup.com;" always;

    add_header X-Content-Type-Options "nosniff" always; # Prevent MIME Sniffing
    add_header X-XSS-Protection "1; mode=block" always; # XSS Filter

    # ----------------------------------------------------------------------
    # 1. Backend Robots.txt
    # ----------------------------------------------------------------------
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /";
    }

    # ----------------------------------------------------------------------
    # 1.5. Favicon Silent Drop (Prevent 500 Errors)
    # ----------------------------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # ----------------------------------------------------------------------
    # 2. Keycloak Proxy
    # ----------------------------------------------------------------------
    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        modsecurity off; # FIX: Prevent 403 Forbidden on Admin Console PUT requests

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ----------------------------------------------------------------------
    # 3. Uploads Handling (ENTERPRISE OPTIMIZATION: Smart Backend Proxy)
    # ----------------------------------------------------------------------
    # AI-CONTEXT: 
    # - RE-ROUTED to Backend (http://backend:8080) to enable "Smart WebP Fallback".
    # - Direct MinIO proxy caused 404s because frontend requests lack extensions.
    # - Backend now handles the lookup, caching, and streaming.
    
    location /uploads/ {
        rewrite ^/uploads/(.*) /api/uploads/$1 last;
    }

    location /api/v1/uploads/ {
        # Strict Security: Only allow reads via Nginx. Writes MUST go through Backend API.
        limit_except GET HEAD { deny all; }

        # CHANGED: Route to Backend instead of MinIO
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enterprise Caching: 1 Year + Immutable (Browser will never ask again)
        # Note: Backend also sets this, but Nginx reinforces it at the edge.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    }

    location /api/uploads/ {
        # Legacy route - also pointed to backend for consistency
        limit_except GET HEAD { deny all; }

        rewrite ^/api/uploads/(.*) /api/v1/uploads/$1 break;
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # 4. Observability (CRITICAL FIX: Forward Intelligence Headers)
    # ----------------------------------------------------------------------
    location /api/v1/monitoring/ingest {
        proxy_pass http://backend:8080/api/v1/monitoring/ingest;
        modsecurity off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- FIX: Explicitly forward Cloudflare & Worker Headers ---
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header X-Visitor-City $http_x_visitor_city;
        proxy_set_header X-Visitor-Region $http_x_visitor_region;
        proxy_set_header X-Visitor-Country $http_x_visitor_country;
        proxy_set_header X-Visitor-Device-Colo $http_x_visitor_device_colo;
        proxy_set_header User-Agent $http_user_agent;
    }

    # ----------------------------------------------------------------------
    # 5. Post Management
    # ----------------------------------------------------------------------
    location /api/v1/posts {
        proxy_pass http://backend:8080; 
        modsecurity off;                

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # 6. Auth & Profile Management (FIXED: Disable ModSecurity for Profile Updates)
    # ----------------------------------------------------------------------
    location /api/v1/auth {
        proxy_pass http://backend:8080;
        modsecurity off; # Fix 403 Forbidden on PUT /profile

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # 7. Backend API Proxy (Catch All)
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://backend:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- FIX: Forward Headers Globally for API Logs ---
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header X-Visitor-City $http_x_visitor_city;
        proxy_set_header X-Visitor-Region $http_x_visitor_region;
        proxy_set_header X-Visitor-Country $http_x_visitor_country;
        proxy_set_header User-Agent $http_user_agent;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}