# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - NGINX reverse proxy configuration for shielding internal services and handling routing.
#  *
#  * Scope:
#  * - ModSecurity WAF enforcement.
#  * - Proxies traffic to backend APIs and Keycloak IAM.
#  *
#  * Critical Dependencies:
#  * - Backend: relies on http://backend:8080
#  * - Keycloak: relies on http://keycloak:8080
#  *
#  * Security Constraints:
#  * - X-Forwarded headers must be explicitly declared for Keycloak to trust the proxy.
#  * - Strict Content-Security-Policy enforcement.
#  *
#  * Non-Negotiables:
#  * - ModSecurity must be disabled on specific routes (e.g., auth, posts) to prevent false positives.
#  *
#  * Change Intent:
#  * - Fix Nginx crash loop by wrapping ModSecurity directives in `modsecurity_rules` string blocks.
#  * - Remove obsolete `http2_max_field_size` and `http2_max_header_size` directives.
#  * - Expanded `SecRuleRemoveById` to range `941000-942999` to resolve CORS masking errors on CMS saves.
#  *
#  * IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#  * - EDITED:
#  * • Replaced limited CSP with full CSP including `default-src`, `script-src`, `connect-src`, `object-src`, and `upgrade-insecure-requests`.
#  * • Added `Strict-Transport-Security` and `Permissions-Policy`. Removed deprecated `X-XSS-Protection`.
#  * • Why: Address CVE-002 (Insecure CSP) and CVE-009 (Deprecated XSS block causing IE vulnerability).
#  *
#  * - EDITED:
#  * • Duplicated security headers inside `location /auth/` but relaxed `script-src` and `style-src` to include `'unsafe-inline'` and `'unsafe-eval'`.
#  * • Why: Fixed the infinite loading screen / React module resolution crash on the Keycloak Admin Console. Nginx inheritance rules mean we must redefine all security headers inside the location block if we change even one of them.
#  *
#  * - EDITED:
#  * • Expanded `img-src` to include `data: https: blob:`, and `script-src`/`style-src`/`font-src` to include `https:`.
#  * • Why: Fixed CSP violations blocking third-party News API images (gray boxes) and required analytical scripts.
#  *
#  * - EDITED:
#  * • Removed `modsecurity off;` from `/api/v1/auth` and `/api/v1/posts`. Replaced with `SecRuleRemoveById`.
#  * • Why: Phase 1 WAF hardening requirement (P1-2). Prevents complete WAF bypass while mitigating false positives caused by JWT tokens and Rich HTML text payloads from Tiptap.
#  *
#  * - EDITED:
#  * • Wrapped `SecRuleRemoveById` in `modsecurity_rules` strings and removed obsolete HTTP/2 sizing directives.
#  * • Why: Fixed Nginx crash loop. ModSecurity v3 for Nginx requires rules to be passed as strings.
#  * #  * - EDITED:
#  * • Expanded `SecRuleRemoveById` exclusions to cover `941000-942999` (XSS and SQLi).
#  * • Why: Fixed "Access-Control-Allow-Origin Missing Header" (CORS) error during blog post creation. ModSecurity was returning a 403 on the rich text payload, stripping the Spring Boot CORS headers in the process.
#  */

server {
    listen 80;
    listen [::]:80;
    server_name backend.treishvaamgroup.com;

    # ----------------------------------------------------------------------
    # 0. GLOBAL SETTINGS & SECURITY SHIELD
    # ----------------------------------------------------------------------
    client_max_body_size 100M;       
    client_header_buffer_size 64k;   
    large_client_header_buffers 4 64k;

    # 🛡️ SECURITY HEADERS (Global Secure Baseline)
    server_tokens off; 
    
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; connect-src 'self' backend.treishvaamgroup.com https:; media-src 'self' https:; frame-src 'self' https:; object-src 'none'; frame-ancestors 'self' https://treishfin.treishvaamgroup.com https://treishvaamfinance.com https://www.treishvaamfinance.com http://localhost:3000; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Content-Type-Options "nosniff" always; 

    # ----------------------------------------------------------------------
    # 1. Backend Robots.txt
    # ----------------------------------------------------------------------
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /";
    }

    # ----------------------------------------------------------------------
    # 1.5. Favicon Silent Drop (Prevent 500 Errors)
    # ----------------------------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # ----------------------------------------------------------------------
    # 2. Keycloak Proxy (FIXED CSP FOR REACT ADMIN CONSOLE)
    # ----------------------------------------------------------------------
    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        modsecurity off; 

        # --- FIX: Relax CSP for Keycloak Admin Console (React Import Maps require unsafe-inline) ---
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; connect-src 'self' backend.treishvaamgroup.com https:; media-src 'self' https:; frame-src 'self' https:; object-src 'none'; frame-ancestors 'self' https://treishfin.treishvaamgroup.com https://treishvaamfinance.com https://www.treishvaamfinance.com http://localhost:3000; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ----------------------------------------------------------------------
    # 3. Uploads Handling
    # ----------------------------------------------------------------------
    location /uploads/ {
        rewrite ^/uploads/(.*) /api/uploads/$1 last;
    }

    location /api/v1/uploads/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    }

    location /api/uploads/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/api/uploads/(.*) /api/v1/uploads/$1 break;
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # 4. Observability
    # ----------------------------------------------------------------------
    location /api/v1/monitoring/ingest {
        proxy_pass http://backend:8080/api/v1/monitoring/ingest;
        modsecurity off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header X-Visitor-City $http_x_visitor_city;
        proxy_set_header X-Visitor-Region $http_x_visitor_region;
        proxy_set_header X-Visitor-Country $http_x_visitor_country;
        proxy_set_header X-Visitor-Device-Colo $http_x_visitor_device_colo;
        proxy_set_header User-Agent $http_user_agent;
    }

    # ----------------------------------------------------------------------
    # 5. Post Management (WAF Exceptions for Rich Text)
    # ----------------------------------------------------------------------
    location /api/v1/posts {
        proxy_pass http://backend:8080; 
        
        # Disable broad XSS and SQLi ranges to prevent CORS masking on large HTML payloads
        modsecurity_rules '
            SecRuleRemoveById 941000-942999;
        ';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # 6. Auth & Profile Management (WAF Exceptions for JWT/Base64)
    # ----------------------------------------------------------------------
    location /api/v1/auth {
        proxy_pass http://backend:8080;
        
        # Disable broad XSS and SQLi ranges for JWT/Base64 auth data
        modsecurity_rules '
            SecRuleRemoveById 941000-942999;
        ';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # 7. Backend API Proxy (Catch All)
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://backend:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header X-Visitor-City $http_x_visitor_city;
        proxy_set_header X-Visitor-Region $http_x_visitor_region;
        proxy_set_header X-Visitor-Country $http_x_visitor_country;
        proxy_set_header User-Agent $http_user_agent;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}