# ===================================================================
# TARGET: Production Configuration
# PHASE 18: Kubernetes Scalability & Vault Secrets
# PHASE 5 Update: Security Hardening (Fort Knox)
# PHASE 1 (Enterprise): Database Batching & Write Optimization
# ===================================================================

app.base-url=https://treishvaamfinance.com
server.port=8080

# --- CONFIGURATION MANAGEMENT (VAULT - REMOVED) ---
# Vault is disabled to prevent startup delays and connection errors.
spring.cloud.vault.enabled=false
# spring.config.import=optional:vault://
# spring.cloud.vault.uri=http://treishvaam-vault:8200
# spring.cloud.vault.authentication=token
# spring.cloud.vault.token=${VAULT_TOKEN}
# spring.cloud.vault.scheme=http
# spring.cloud.vault.fail-fast=false

# --- OBSERVABILITY & SECURITY ---
# \uD83D\uDD12 SECURE ACTUATOR: Only expose health and metrics. Never expose 'env' or 'heapdump'.
management.endpoints.web.exposure.include=health,prometheus
# \uD83D\uDD12 DATA LEAK PREVENTION: Never show stack traces or env details in health check
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ROLE_ADMIN

# --- API DOCUMENTATION SECURITY ---
# \uD83D\uDD12 DISABLE SWAGGER: Hide API docs in production to prevent reconnaissance
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- DISTRIBUTED TRACING ---
management.tracing.sampling.probability=0.1
management.zipkin.tracing.endpoint=http://tempo:9411/api/v2/spans

# --- LOGGING ---
logging.file.name=/app/logs/backend.json
logging.level.root=INFO
logging.level.com.treishvaam.finance=INFO

# --- RABBITMQ MESSAGING (FIXED) ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
# \uD83D\uDD12 SECURE: Credentials injected via Docker Environment
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.template.exchange=internal.exchange

# --- DATABASE ---
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Phase 4: Database Connection Pooling (HikariCP - Enterprise Tuning)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=TreishvaamHikariPool
spring.datasource.hikari.keepalive-time=120000

# --- JPA & PERFORMANCE ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
# Batching to reduce round-trips for bulk operations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- JSON SERIALIZATION ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# --- RESPONSE COMPRESSION (Phase 8) ---
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=2048

# --- CRITICAL FIX: FILE UPLOAD LIMITS ---
# Must match or exceed Nginx's 100MB limit
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# --- SECURITY & JWT ---
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration.ms=86400000
app.security.internal-secret=${INTERNAL_API_SECRET_KEY}

# --- KEYCLOAK (OAUTH2) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

# --- CORS (Cross-Origin Resource Sharing) ---
# Explicitly set for Prod to prevent fallbacks
# UPDATED: Replaced treishfin.treishvaamgroup.com with treishvaamfinance.com
app.cors.allowed-origins=https://treishvaamfinance.com,https://www.treishvaamfinance.com,https://www.treishvaamgroup.com,https://treishvaamgroup.com
cors.allowed-origins=https://treishvaamfinance.com,https://www.treishvaamfinance.com,https://www.treishvaamgroup.com,https://treishvaamgroup.com

# --- REDIS ---
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
# Simplified cache properties to prevent Spring Boot 3.4.x binding failures
spring.cache.redis.time-to-live=600000

# --- ELASTICSEARCH ---
spring.elasticsearch.uris=http://elasticsearch:9200
spring.elasticsearch.socket-timeout=30s
spring.elasticsearch.connection-timeout=5s

# --- MINIO & STORAGE (FIXED) ---
storage.s3.endpoint=http://minio:9000
storage.s3.region=us-east-1
# \uD83D\uDD12 SECURE: Credentials injected via Docker Environment
storage.s3.access-key=${MINIO_ACCESS_KEY}
storage.s3.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=treishvaam-uploads
storage.s3.bucket=treishvaam-uploads
storage.upload-dir=/app/uploads
storage.sitemap-dir=/app/sitemaps

# --- PYTHON SCRIPTS ---
app.python.script.path=/app/scripts/market_data_updater.py

# --- LIQUIBASE ---
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# --- ADMIN ---
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.username=admin

# --- EXTERNAL APIS ---
fmp.api.key=${MARKET_DATA_API_KEY}
alphavantage.api.key=${ALPHAVANTAGE_API_KEY}
finnhub.api.key=${FINNHUB_API_KEY}
newsdata.api.key=${NEWS_API_KEY}

# --- GOOGLE ANALYTICS & BIGQUERY (Phase 10) ---
ga4.property-id=${GA4_PROPERTY_ID}
ga4.credentials-path=/app/ga4-credentials.json
ga4.bigquery.project-id=${GA4_BIGQUERY_PROJECT_ID}
ga4.bigquery.dataset-id=${GA4_BIGQUERY_DATASET_ID}