#  * • Injected `> logs/deploy_telemetry.ndjson` to explicitly clear the telemetry file BEFORE launching `auto_deploy.sh`.
#  * • Reason: Engine A's polling loop was instantly reading stale `COMPLETION` events from previous failed deployments. This caused Engine A to abort in 0s and trigger the `always()` trap, which wiped `.env` out from under the actively booting Engine B orchestrator, resulting in blank passwords and fatal NOAUTH loops.
#  *
#  * - EDITED (Infrastructure Sync Blindspot Fix - 2026-07-02):
#  * • Added explicit `cp` commands for `Dockerfile`, `aegis/`, `config/`, and `nginx/` into the Deploy to Application Folder step.
#  * • Reason: The pipeline was compiling WAR files but failing to push updated `Dockerfile` or ZKP microservice definitions to `/opt/treishvaam/`. This caused Engine B to continuously execute `docker compose up --build` against stale 6-day-old files, resulting in persistent Maven Java Heap OOMs and ZKP crash loops. The synchronization is now absolute.
#  *
#  * - EDITED (Anti-Race Condition Vault Ownership Fix - 2026-07-02):
#  * • Removed the `Secure Flash & Wipe (Guaranteed Cleanup)` step entirely from Engine A.
#  * • Reason: Engine B runs asynchronously in the background. If Engine A's polling loop aborted or the runner was canceled, Engine A's `always()` trap wiped the `.env` file while Engine B was actively booting containers. This injected blank passwords and triggered catastrophic NOAUTH database lockouts. Engine B's internal `EXIT` trap is now the sole, exclusive owner of the `.env` lifecycle.
#  *
#  * - EDITED (Directory Nesting Paradox Fix - 2026-07-03):
#  * • Replaced `cp -r <dir>` with `cp -a <dir>/. /opt/treishvaam/<dir>/`.
#  * • Reason: Linux `cp -r` places the source directory *inside* the target if the target already exists (e.g., creating `aegis/aegis/`). This silently prevented Dockerfile updates from applying. `cp -a .` mathematically guarantees absolute content overwriting.
#  *
#  * - EDITED (Cross-Engine Metadata Injection & Detachment Hardening - 2026-07-03):
#  * • Added a step to extract `git log` metadata (Hash, Message) and serialize it into `/opt/treishvaam/.deploy_meta`.
#  * • Injected `sed -i 's/\r$//'` to universally sanitize Windows CRLF characters from shell scripts.
#  * • Upgraded `nohup` to `setsid nohup` to mathematically guarantee the Git Runner cannot SIGTERM Engine B when it disconnects.
#  * • Reason: Engine B runs in a detached execution context outside the Git boundary. Engine A must manually cross the boundary to pass the commit variables for Telegram telemetry.
#  *
#  * - EDITED (Engine A Polling Synchronization Fix - 2026-07-03):
#  * • Upgraded the Polling Regex to accept `grep -E '"phase":"(COMPLETION|CLEANUP)"'`.
#  * • Reason: Engine B was accurately aborting early and firing its EXIT trap (emitting CLEANUP telemetry) when infrastructure builds failed. Engine A was stubbornly searching for COMPLETION and timed out infinitely. This allows Engine A to detect catastrophic aborts immediately.
#  *
#  * - DO-NOT-DELETE RULE (ABSOLUTE):
