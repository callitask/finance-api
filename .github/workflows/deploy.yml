name: Treishvaam Enterprise Deploy

on:
  push:
    branches: [ "main", "staging", "develop" ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # Run weekly on Sunday at 02:00 AM UTC for regular dependency scanning

env:
  # Force GitHub marketplace actions to utilize the Node 24 runtime to resolve deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  # PHASE 4: Extracted Security Scan to run independently to unblock deployments
  dependency-security-scan:
    runs-on: self-hosted
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: OWASP Dependency Check (Vulnerability Scanning)
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        echo "🛡️ Running OWASP Dependency-Check via Maven..."
        chmod +x mvnw
        export MAVEN_OPTS="-Xmx1024m"
        ./mvnw org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=8 \
          -DsuppressionFiles=dependency-check-suppressions.xml \
          -DnvdApiKey="$NVD_API_KEY" \
          -DossindexAnalyzerEnabled=false || echo "⚠️ Non-critical vulnerabilities found, logging output..."

  build-and-deploy:
    runs-on: self-hosted
    # Only block build-and-deploy if pushed. Cron jobs just run the security scan.
    if: github.event_name != 'schedule'
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify GPG Commit Signature (Security Integrity Gate)
      env:
        # Inject secret securely into the environment to prevent multiline bash mangling
        GPG_PUB_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      run: |
        echo "🔐 Verifying GPG commit signature for: $(git rev-parse HEAD)"
        
        if [ -z "$GPG_PUB_KEY" ]; then
          echo "❌ SECURITY ALERT: GPG_PUBLIC_KEY secret is missing or empty in GitHub Secrets."
          exit 1
        fi
        
        # Import developer's public key into runner GPG keyring securely
        echo "$GPG_PUB_KEY" | gpg --import --batch
        
        COMMIT=$(git rev-parse HEAD)
        
        # Verify signature — exit 1 blocks deployment on failure
        if git verify-commit "$COMMIT"; then
          echo "✅ Commit $COMMIT has a VALID GPG signature. Deployment authorized."
        else
          echo "❌ SECURITY ALERT: Commit $COMMIT is UNSIGNED or has an INVALID signature."
          echo "❌ Deployment BLOCKED. Possible account compromise or policy violation."
          exit 1
        fi

    - name: Pre-Flight Cleanup (Self-Healing Runner State)
      run: sudo rm -f /tmp/gitleaks.tmp || true

    - name: Secret Scanning (Gitleaks — Prevent Credential Exposure)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Log Deployment Branch
      run: |
        echo "🚀 DEPLOYING BRANCH: ${{ github.ref_name }}"
        echo "Server will now be updated with code from ${{ github.ref_name }}..."

    - name: Build with Maven
      run: |
        chmod +x mvnw
        export MAVEN_OPTS="-Xmx1024m"
        ./mvnw clean package -DskipTests -B

    - name: Deploy to Application Folder
      run: |
        echo "--> Copying new WAR file..."
        cp target/finance-api.war /opt/treishvaam/backend-app.war

        echo "--> Syncing deployment scripts and FULL infrastructure configs..."
        mkdir -p /opt/treishvaam/scripts /opt/treishvaam/backup /opt/treishvaam/aegis /opt/treishvaam/config /opt/treishvaam/nginx
        
        # Use cp -a <source>/. to mathematically guarantee file overwriting and prevent nested directories
        cp -a scripts/. /opt/treishvaam/scripts/
        cp -a backup/. /opt/treishvaam/backup/
        cp -a aegis/. /opt/treishvaam/aegis/
        cp Dockerfile /opt/treishvaam/
        cp docker-compose.yml /opt/treishvaam/
        cp -a config/. /opt/treishvaam/config/ 2>/dev/null || true
        cp -a nginx/. /opt/treishvaam/nginx/ 2>/dev/null || true

        echo "--> Sanitizing Windows CRLF characters from execution scripts..."
        find /opt/treishvaam/scripts/ -type f -name "*.sh" -exec sed -i 's/\r$//' {} +
        find /opt/treishvaam/backup/ -type f -name "*.sh" -exec sed -i 's/\r$//' {} +

        echo "--> Extracting Git Metadata for Engine B Telemetry..."
        GIT_COMMIT=$(git log -1 --format="%h")
        GIT_MSG=$(git log -1 --format="%s")
        cat <<EOF > /opt/treishvaam/.deploy_meta
        GIT_COMMIT="${GIT_COMMIT}"
        GIT_MSG="${GIT_MSG}"
        EOF
        sed -i 's/\r$//' /opt/treishvaam/.deploy_meta

        echo "--> Triggering Enterprise Watchdog (Global Stack Refresh) asynchronously..."
        cd /opt/treishvaam
        chmod +x scripts/auto_deploy.sh
        
        # CLEAR THE STALE TELEMETRY FILE TO PREVENT POLLING RACE CONDITIONS!
        mkdir -p logs
        > logs/deploy_telemetry.ndjson
        
        # Unset tracking ID to blind GitHub Actions' cleanup process
        export RUNNER_TRACKING_ID=""
        
        # Use setsid to mathematically detach the process from the GitHub Runner's session group
        setsid nohup ./scripts/auto_deploy.sh --force > /opt/treishvaam/deploy_pipeline.log 2>&1 &
        echo "--> Watchdog detached successfully. The server will safely reboot the stack in the background."

    - name: Poll Engine B Deployment Status (15-min window)
      run: |
        echo "⏳ Polling Engine B deployment status (max 15 minutes)..."
        TELEMETRY_FILE="/opt/treishvaam/logs/deploy_telemetry.ndjson"
        MAX_WAIT=900
        ELAPSED=0
        POLL_INTERVAL=15
        
        while [ $ELAPSED -lt $MAX_WAIT ]; do
          # Look for a SUCCESS or FAILURE event
          if [ -f "$TELEMETRY_FILE" ]; then
            TERMINAL=$(tail -n 20 "$TELEMETRY_FILE" | grep -E '"status":"(SUCCESS|FAILURE)"' | \
                       grep -E '"phase":"(COMPLETION|CLEANUP)"' | tail -1)
            if [ -n "$TERMINAL" ]; then
              STATUS=$(echo "$TERMINAL" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d['status'])")
              MESSAGE=$(echo "$TERMINAL" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d['message'])")
              if [ "$STATUS" = "SUCCESS" ]; then
                echo "✅ Engine B confirmed SUCCESS: $MESSAGE"
                exit 0
              else
                echo "🚨 Engine B confirmed FAILURE: $MESSAGE"
                exit 1
              fi
            fi
          fi
          echo "  > Waiting... (${ELAPSED}s elapsed)"
          sleep $POLL_INTERVAL
          ELAPSED=$((ELAPSED + POLL_INTERVAL))
        done
        
        echo "⚠️ Engine B did not report a terminal status within 15 minutes."
        echo "This likely means Engine B is still running (slow container startup) or was silently killed."
        echo "Check: /opt/treishvaam/deploy_pipeline.log on the server."
        # Exit 0 here (don't fail the CI job) — the Dead Man's Switch in Grafana handles the alert
        exit 0