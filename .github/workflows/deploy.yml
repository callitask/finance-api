# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - GitHub Actions workflow for building and deploying the Treishvaam Finance Backend.
#  *
#  * Scope:
#  * - Triggers on pushes to main, staging, and develop.
#  * - Executes Maven build on a self-hosted runner and deploys the WAR file.
#  *
#  * Critical Dependencies:
#  * - Backend: Compiles `finance-api.war` and restarts the `backend` Docker container.
#  *
#  * Security Constraints:
#  * - Self-hosted runner environment constraints (memory limits).
#  *
#  * Non-Negotiables:
#  * - Must not exhaust runner memory (OOM killer prevention).
#  *
#  * Change Intent:
#  * - Resolve Exit Code 137 (OOM Killer) by capping Maven heap size and removing aggressive multi-threading.
#  *
#  * Future AI Guidance:
#  * - Do not re-introduce `-T 1C` unless the self-hosted runner is confirmed to have >8GB RAM.
#  * - Always maintain `MAVEN_OPTS` memory boundaries.
#  *
#  * IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#  * - EDITED:
#  * • Added `export MAVEN_OPTS="-Xmx1024m"` to the Maven build step.
#  * • Removed `-T 1C` flag from the Maven command.
#  * • Why: The self-hosted runner was experiencing OOM (Out-Of-Memory) kills (Exit code 137) during the Spotless/Checkstyle/Spring Boot repackage phases. Capping heap and forcing single-threaded execution stabilizes the build.
#  *
#  * - EDITED (Phase 1):
#  * • Added GPG Commit Signature Verification step.
#  * • Added Gitleaks Secret Scanning step.
#  * • Why: Enforce cryptographic commit integrity and prevent leaked credentials from reaching production.
#  */

name: Treishvaam Enterprise Deploy

on:
  push:
    branches: [ "main", "staging", "develop" ]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add GPG_PUBLIC_KEY Secret to GitHub Actions
      run: echo "GPG secret configured — see setup instructions in AI-CONTEXT"

    - name: Verify GPG Commit Signature (Security Integrity Gate)
      run: |
        echo "🔐 Verifying GPG commit signature for: $(git rev-parse HEAD)"
        
        # Import developer's public key into runner GPG keyring
        echo "${{ secrets.GPG_PUBLIC_KEY }}" | gpg --import --batch 2>&1
        
        COMMIT=$(git rev-parse HEAD)
        
        # Verify signature — exit 1 blocks deployment on failure
        if git verify-commit "$COMMIT" 2>&1; then
          echo "✅ Commit $COMMIT has a VALID GPG signature. Deployment authorized."
        else
          echo "❌ SECURITY ALERT: Commit $COMMIT is UNSIGNED or has an INVALID signature."
          echo "❌ Deployment BLOCKED. Possible account compromise or policy violation."
          exit 1
        fi

    - name: Secret Scanning (Gitleaks — Prevent Credential Exposure)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      with:
        args: --redact --verbose

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        # cache: 'maven'  <-- Disabled to prevent 800MB downloads on self-hosted runner

    - name: Log Deployment Branch
      run: |
        echo "🚀 DEPLOYING BRANCH: ${{ github.ref_name }}"
        echo "Server will now be updated with code from ${{ github.ref_name }}..."

    - name: Build with Maven
      run: |
        chmod +x mvnw  # <--- CRITICAL FIX: Makes the script executable
        export MAVEN_OPTS="-Xmx1024m" # <--- OOM FIX: Restrict memory to 1GB to prevent Exit Code 137
        ./mvnw clean package -DskipTests -B

    - name: Deploy to Application Folder
      run: |
        echo "--> Stopping Background Services to free RAM..."
        # docker compose -f /opt/treishvaam/docker-compose.yml stop elasticsearch loki tempo

        echo "--> Copying new WAR file..."
        cp target/finance-api.war /opt/treishvaam/backend-app.war

        echo "--> Restarting Backend..."
        cd /opt/treishvaam
        
        # --- ENTERPRISE FIX: ROBUST CONTAINER RESTART ---
        # 1. Force stop the service (ignore errors if already stopped)
        docker compose stop backend || true
        
        # 2. Force remove the container state (fixes "No such container" error)
        docker compose rm -f -s -v backend || true
        
        # 3. Bring up fresh container
        docker compose up -d --force-recreate --no-deps backend
        
        # docker compose start elasticsearch loki tempo
        
        echo "--> Pruning unused Docker images..."
        docker image prune -f

    - name: Verify Deployment
      run: |
        echo "Waiting for Backend to initialize..."
        sleep 15
        if docker ps | grep -q treishvaam-backend; then
          echo "✅ Backend Container is Running with version form branch: ${{ github.ref_name }}"
        else
          echo "❌ Backend Container failed to start"
          exit 1
        fi