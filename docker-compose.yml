# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - Core infrastructure definition for the Treishvaam backend ecosystem.
#  *
#  * Scope:
#  * - Manages internal networking, service discovery, and container lifecycles.
#  *
#  * Critical Dependencies:
#  * - Backend: relies on treishvaam-db, treishvaam-redis, elasticsearch, rabbitmq, keycloak, and permission-fixer.
#  * - RabbitMQ: Must be healthy (not just started) for backend to boot successfully.
#  *
#  * Security Constraints:
#  * - Keycloak, Grafana, and RabbitMQ UIs must remain on loopback or private networks, never exposed on 0.0.0.0.
#  * - Database credentials must be mapped dynamically via host env variables.
#  *
#  * IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#  * - EDITED (MariaDB PITR Enforcement - v4.0):
#  * • Modified `treishvaam-db` entrypoint to execute mariadbd with `--log-bin=mariadb-bin --server-id=1 --binlog-format=ROW`.
#  * • Reason: Enabled true Point-In-Time-Recovery (PITR) for enterprise backups without bypassing security constraints.
#  *
#  * - STRATEGIC PIVOTS & FAILED ATTEMPTS (Canary Server Evolution):
#  * • Strategy Attempted: Executing `twistd -ny` override on dummy image. Failure Mode: OCI runtime error (no binary existed), aborted entire deployment pipeline. Future AI Warning: Never blindly modify startup commands without verifying binary existence.
#  * • Strategy Attempted: `printenv > .env` memory bridge. Failure Mode: Vendor's Python globbing (`*.env`) ignored the file because Linux inherently hides `.env` files.
#  * • Strategy Attempted: `echo KEY="VALUE" > frontend.env`. Failure Mode: Legacy Python 2.7 dotenv parser absorbed double quotes directly into the Base64 string, corrupting the cryptographic seeds and crashing OpenSSL.
#  *
#  * - EDITED (Canary Deception Stabilization & Zero-Trust Bridge - v5.0/v6.0):
#  * • Upgraded `aegis-canary-server` from dummy to `thinkst/canarytokens:v2_latest`.
#  * • Injected Canary cryptographic seeds (`WG_PRIVATE_KEY_SEED`, `CANARY_SECRET_KEY`) dynamically via Infisical mapping to prevent disk persistence.
#  * • Implemented a native POSIX `cat <<EOF > switchboard.env` heredoc in the entrypoint. 
#  * • Reason: This completely bypasses shell-mangling and hidden file globbing, successfully satisfying the vendor's hardcoded physical file requirement using ephemeral container memory.
#  *
#  * - STRATEGIC PIVOTS & FAILED ATTEMPTS (Wazuh HIDS & Envoy):
#  * • Strategy Attempted: Commenting out Wazuh Agent to bypass connection loop. User Correction: NEVER comment out security features. Engineered full wazuh-manager deployment instead.
#  * • Strategy Attempted: Bridging Wazuh Manager to Elastic 8.17. Failure Mode: Wazuh 4.14 strictly requires OpenSearch/Wazuh Indexer.
#  * • Strategy Attempted: Shell `nc` healthcheck on `envoy-sidecar`. Failure Mode: Envoy image is distroless; lacked `nc` binary, causing false-unhealthy flags. Healthcheck permanently removed.
#  *
#  * - EDITED (Enterprise Wazuh HIDS & Single-Node Healthcheck Precision - v6.0):
#  * • Deployed `wazuh-manager` service to natively accept `wazuh-agent` enrollments.
#  * • Injected `hostname: wazuh.manager` to stabilize internal cluster bindings.
#  * • Adjusted `wazuh-manager` healthcheck to test `/var/ossec/bin/wazuh-control status | grep 'wazuh-remoted is running'`.
#  * • Reason: The global status returned exit code 1 because `wazuh-clusterd` intentionally shuts down in a constrained single-node environment (lacking an Indexer). This precision check accurately reflects that the core HIDS daemon is protecting the host without artificially failing the CI/CD pipeline.
#  *
#  * - EDITED (Wazuh Agent Enrollment & Keycloak Production Optimization):
#  * • Fixed `wazuh-agent` environment variable `WAZUH_MANAGER_SERVER` to native `WAZUH_MANAGER` strictly matching the Wazuh documentation routing protocol.
#  * • Transitioned `treishvaam-keycloak` command from `start-dev` to `start` for optimized Quarkus production deployment and lower JVM memory consumption.
#  * • Reason: Corrects the (1208) enrollment connection error on agent while preserving the memory caps for the VirtualBox limits.
#  *
#  * - EDITED (Heredoc Indentation Fix & Wazuh Agent S6-Overlay Resolution):
#  * • Replaced indented `cat <<EOF` heredoc in `aegis-canary-server` with explicit `printf` payload into `frontend.env`.
#  * • Reason: YAML block scalars (`|`) combined with spaces before heredocs injected leading spaces into the keys. The `thinkst/canarytokens` legacy python dotenv parser misread keys like `"        WG_PRIVATE_KEY_SEED"`, causing startup crash loops. `printf` guarantees zero structural whitespace.
#  * • Reverted `wazuh-agent` environment variable to `WAZUH_MANAGER_IP=wazuh.manager` alongside `WAZUH_MANAGER_SERVER=wazuh.manager`.
#  * • Reason: Wazuh agent `s6-overlay` initialization specifically enforces legacy manager variables. The prior shift to `WAZUH_MANAGER` resulted in an empty string read and immediate `wazuh-agentd: ERROR: (1215)` crashes.
#  *
#  * - STRATEGIC PIVOTS & FAILED ATTEMPTS (Canary Parsing):
#  * • Strategy Attempted: Formatting `cat <<EOF` inside YAML block scalars.
#  * • Failure Mode: The leading visual YAML spaces were captured by the heredoc and prepended to the environment variable names, failing the vendor's strict exact-match parser.
#  * • Date/Phase: 2026-06-17
#  * • Future AI Warning: Never use indented heredocs inside `docker-compose.yml` for configuration file generation. Use single-line `printf` to ensure literal byte accuracy without YAML whitespace injection.
#  *
#  * - EDITED (Canary Switchboard Parser Resolution):
#  * • Reverted `aegis-canary-server` config generation filename from `frontend.env` back to `switchboard.env`.
#  * • Migrated from `printf` to explicit, sequential `echo` statements without quotes.
#  * • Reason: The Python parser strictly requires `switchboard.env` for `WG_PRIVATE_KEY_SEED`. While `printf` solved the YAML indentation, generating `frontend.env` caused the switchboard module to miss the configuration entirely. Sequential `echo` ensures strict `KEY=VALUE` mapping without quoting corruption.
#  *
#  * - STRATEGIC PIVOTS & FAILED ATTEMPTS (Canary Parsing 2.0):
#  * • Strategy Attempted: Generating `frontend.env` to supply variables to the `frontend.tac` application.
#  * • Failure Mode: The `switchboard` Python module (which `frontend.tac` imports) hardcodes a lookup for `switchboard.env`. Naming the file `frontend.env` resulted in `Required setting WG_PRIVATE_KEY_SEED not defined in a *.env file`.
#  * • Future AI Warning: Always generate `switchboard.env` for Canarytokens.
#  *
#  * - EDITED (Kernel OOM-Killer Prevention & JVM Memory Optimization):
#  * • Reduced hardcoded container memory limits across infrastructure (DB, Keycloak, Elasticsearch, Backend, Wazuh, Prometheus, RabbitMQ).
#  * • Adjusted Java Heap sizes (-Xms/-Xmx) for Elasticsearch, Keycloak, and Backend to guarantee footprint stays within physical cgroup bounds.
#  * • Reason: The host VM has 4.8GB of physical RAM. Docker Swap Accounting is disabled by default in the Ubuntu kernel, rendering the 4GB swap file useless (0B used). When containers initialized, the physical RAM spiked, causing the Kernel OOM-Killer to assassinate the Java processes. Shrinking allocations forces the stack to fit safely inside the physical 4.8GB boundary without triggering cgroup panics.
#  *
#  * - EDITED (ZKP Distroless Healthcheck Removal):
#  * • Removed `nc` based healthcheck from `aegis-zkp-service`.
#  * • Reason: The container is built from a distroless base image which lacks the netcat binary, causing the healthcheck to fatally exit and kill the ZKP microservice.
#  *
#  * - EDITED (Canary Pure-Memory Bridge Resolution):
#  * • Replaced manual `echo` statements with a raw `env > settings.env` dump in `aegis-canary-server`.
#  * • Reason: Docker Compose shell evaluation (`$$`) stripped values before they reached the `.env` file, causing the Python parser to read empty keys. Dumping raw OS memory directly into the file guarantees perfect fidelity.
#  *
#  * - STRATEGIC PIVOTS & FAILED ATTEMPTS (Canary Parsing 3.0 - Filename Typo):
#  * • Strategy Attempted: Dumping environment via `env > settings.env`.
#  * • Failure Mode: The legacy Python script exclusively parses `switchboard.env`. Generating `settings.env` caused the system to bypass the file and crash with a missing key error.
#  * • Future AI Warning: The target file MUST be named `switchboard.env` exactly. No other filenames are parsed.
#  *
#  * - EDITED (Canary Final Filename Fix):
#  * • Corrected the entrypoint dump from `env > settings.env` to `env > switchboard.env`.
#  * • Reason: Restores exact filename required by vendor Python parser to properly digest the RAM-bridged cryptographic seeds.
#  *
#  * - EDITED (Canary Quoting & Integrity Lock):
#  * • Wrapped switchboard.env values in explicit double quotes (`"KEY=\"$$KEY\""`).
#  * • Added a pre-flight integrity check to crash the container gracefully if `WG_PRIVATE_KEY_SEED` is empty.
#  * • Reason: The Canary Python parser strictly requires values to be explicitly quoted. Furthermore, manual executions of `docker compose up` while the host `.env` was wiped caused Docker to secretly poison the container with blank variables. The integrity check prevents the cryptic Python crash and provides a clear diagnostic.
#  *
#  * - EDITED (Canary Ultimate Target Coverage):
#  * • Replaced quoted evaluation with direct literal unquoted strings and cloned the file to `frontend.env`, `switchboard.env`, and `.env`.
#  * • Reason: The vendor's legacy Python parser is highly brittle. It corrupts if double quotes are present, and their repository documentation contradicts itself on whether it loads `frontend.env` or `switchboard.env`. Dumping unquoted strings to all three fallback paths guarantees the daemon intercepts the config natively without parsing errors.
#  *
#  * - STRATEGIC PIVOTS & FAILED ATTEMPTS (Wazuh Agent S6 Collision & Canary Dotenv Noise):
#  * • Strategy Attempted: Injecting `WAZUH_MANAGER` alongside legacy IPs, and dumping `env > switchboard.env` for Canary.
#  * • Failure Mode: Wazuh's S6-overlay collided doing simultaneous XML sed replacements, crashing with exit 1. Canary's legacy Python parser choked on native Docker Compose affinity/function noise present in the raw OS env dump.
#  * • Future AI Warning: Never add `WAZUH_MANAGER` to the agent if legacy IP variables exist. Never dump raw OS environment arrays into legacy Python dotenv consumers.
#  *
#  * - EDITED (S6 Initialization Fix & POSIX-Native Canary Extraction - v6.1):
#  * • Removed `WAZUH_MANAGER=wazuh.manager` from `wazuh-agent` to prevent XML sed collision.
#  * • Replaced raw `echo`/`env` dump in `aegis-canary-server` with a native POSIX `awk` extraction bridge pulling strictly from C-level `ENVIRON`.
#  * • Reason: Awk guarantees perfect `KEY=VALUE` formatting, bypasses all shell mangling/quoting risks, and insulates the brittle Python parser from Docker system noise while preserving zero-trust disk limits.
#  *
#  * - EDITED (Strict Zero-Leak POSIX Printf Bridge & Dotless S6 Agent Fix):
#  * • Replaced `awk` and `env | grep` memory pipelines with strictly scoped `printf "KEY=%s\n" "$$KEY"` sequence for Canary server.
#  * • Stripped legacy IP variables from Wazuh Agent and provided a single `WAZUH_MANAGER=treishvaam-wazuh-manager` resolution.
#  * • Reason: (1) `env` pipelines theoretically expose container memory buffers to stdout. The strict `printf` sequence guarantees zero leak risk of other Infisical keys, while maintaining mathematically perfect `KEY=VALUE` parsing for Python. (2) S6's internal XML `sed` script crashes when injecting hostnames with dots (`wazuh.manager`). Using the dotless Docker Compose DNS name natively bypasses the crash.
#  *
#  * - EDITED (Canary CRLF Shield & Wazuh Agent S6 Variable Synthesis - P0 Resolution):
#  * • Appended POSIX shell comment markers (#) to every line of `aegis-canary-server` entrypoint block scalar.
#  * • Reason: Windows Git checkouts introduce CRLF endings, which the Compose YAML parser preserves. /bin/sh was interpreting `\r` as a filename character, creating `switchboard.env\r` and failing the Python glob validation. The # marker safely absorbs the carriage return as a comment.
#  * • Replaced `WAZUH_MANAGER` in `wazuh-agent` with legacy `WAZUH_MANAGER_IP=treishvaam-wazuh-manager` and `WAZUH_MANAGER_SERVER=treishvaam-wazuh-manager`.
#  * • Reason: S6 initialization scripts strictly enforce the legacy variables. The dotless internal DNS prevents XML `sed` collisions while satisfying the parser requirements.
#  *
#  * - EDITED (Promtail Telemetry Scrape):
#  * • Added `/opt/treishvaam/logs:/host-logs:ro` read-only bind mount to `treishvaam-promtail`.
#  * • Reason: Grants Promtail strict Zero-Trust access to ingest the `engine_b.ndjson` deployment telemetry natively into Loki.
#  *
#  * - STRATEGIC PIVOTS & FAILED ATTEMPTS (Canary Python Parser Quote Loop):
#  * • Strategy Attempted: Wrapping values in explicit double quotes (`printf 'KEY="%s"\n'`).
#  * • Failure Mode: Legacy Python 2.7 dotenv parsers interpret literal double quotes as part of the string, which corrupts the Base64 keys and fails regex validation, triggering the 'Required setting not defined' error loop.
#  * • Future AI Warning: NEVER use explicit quotes (`""` or `''`) around `%s` in the Canary entrypoint block. It must remain pure, raw strings for compatibility.
#  *
#  * - EDITED (CI/CD Remediation - Phase 3 Hardening & Canary Crash Resolution):
#  * • Removed custom `entrypoint` block entirely from `aegis-canary-server`. Native Docker Compose `environment:` injection correctly passes variables to the vendor's internal OS context. Generating a physical `.env` file via Windows checkout introduced CRLF (\r) characters, which the legacy Python parser choked on, falsely reporting the key as undefined.
#  * • Reduced memory limits and JVM Heaps aggressively across the stack: Elasticsearch (384M, 192m heap), Wazuh Manager (384M), Backend (512M, 256m heap).
#  * • Reason: The 4.8GB host VM was thrashing 1GB of Swap during the `docker-compose up` wave, causing severe Disk I/O wait. This starved the GitHub Actions runner agent of CPU, causing it to drop offline and fail the CI pipeline prematurely.
#  *
#  * - DO-NOT-DELETE RULE (ABSOLUTE):
#  * This IMMUTABLE CHANGE HISTORY section acts as the institutional memory for future AI sessions. 
#  * It must never be deleted, truncated, rewritten, or regenerated. Future AI must append only. 
#  * If a future AI suggests a strategy listed under FAILED ATTEMPTS, it is a protocol error.
#  */

networks:
  treish_net:
    driver: bridge

volumes:
  app_logs:
  app_uploads:
  app_sitemaps:

services:
  treishvaam-db:
    image: mariadb:10.6
    container_name: treishvaam-db
    restart: always
    networks:
      - treish_net
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_PASSWORD}
      MYSQL_DATABASE: finance_db
      MARIADB_ENCRYPTION_KEY: ${MARIADB_ENCRYPTION_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/mysql/encryption
        CLEAN_KEY=$$(echo "$$MARIADB_ENCRYPTION_KEY" | grep -oE '[A-Fa-f0-9]{64}')
        printf '1;%s\n' "$$CLEAN_KEY" > /etc/mysql/encryption/keyfile
        chown mysql:mysql /etc/mysql/encryption/keyfile
        exec docker-entrypoint.sh mariadbd --log-bin=mariadb-bin --server-id=1 --binlog-format=ROW
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./config/mariadb/encryption.cnf:/etc/mysql/conf.d/encryption.cnf:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: mariadb:10.6
    container_name: treishvaam-keycloak-db
    restart: always
    networks:
      - treish_net
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_PASSWORD}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./data/keycloak-db:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: treishvaam-keycloak
    restart: always
    networks:
      - treish_net
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: backend.treishvaamgroup.com
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: keycloak-admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xmx384m -Xms256m"
      FINANCE_FRONTEND_URL: ${FINANCE_FRONTEND_URL:-https://treishvaamfinance.com}
      FINANCE_FRONTEND_LOCAL_URL: ${FINANCE_FRONTEND_LOCAL_URL:-http://localhost:3000}
    command: [ "start", "--import-realm" ]
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      keycloak-db:
        condition: service_healthy

  treishvaam-redis:
    image: redis:7-alpine
    container_name: treishvaam-redis
    restart: always
    networks:
      - treish_net
    volumes:
      - ./data/redis:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --stop-writes-on-bgsave-error
      - "no"
      - --protected-mode
      - "yes"
      - --bind
      - 0.0.0.0
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
      - --rename-command
      - MONITOR
      - ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDISCLI_AUTH ping | grep PONG" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis-canary-redis
    restart: always
    networks:
      - treish_net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  aegis-canary-server:
    image: thinkst/canarytokens:v2_latest
    container_name: aegis-canary-server
    restart: always
    networks:
      - treish_net
    environment:
      CANARY_DOMAINS: "canary.treishvaamgroup.com"
      CANARY_PUBLIC_DOMAIN: "canary.treishvaamgroup.com"
      CANARY_NXDOMAINS: "nx.treishvaamgroup.com"
      WG_PRIVATE_KEY_SEED: ${WG_PRIVATE_KEY_SEED}
      CANARY_SECRET_KEY: ${CANARY_SECRET_KEY}
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: treishvaam-minio
    restart: always
    networks:
      - treish_net
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    command: [ "server", "/data", "--console-address", ":9001" ]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: treishvaam-elastic
    restart: always
    networks:
      - treish_net
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms192m -Xmx192m"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    volumes:
      - ./data/elastic:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: [ "CMD-SHELL", "curl -u elastic:$$ELASTIC_PASSWORD -s http://localhost:9200/_cluster/health | grep -E -q 'status.*(green|yellow)'" ]
      interval: 20s
      timeout: 10s
      retries: 10

  tunnel:
    image: cloudflare/cloudflared
    container_name: treishvaam-tunnel
    restart: always
    networks:
      - treish_net
    command: [ "tunnel", "run" ]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 128M

  envoy-sidecar:
    image: envoyproxy/envoy:v1.29-latest
    container_name: treishvaam-envoy
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/envoy.yaml:/etc/envoy/envoy.yaml
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - backend

  aegis-zkp-service:
    build: ./aegis/zkp-service
    image: treishvaam/aegis-zkp-service:latest
    container_name: aegis-zkp-service
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.5
    container_name: treishvaam-wazuh-manager
    hostname: wazuh.manager
    restart: always
    networks:
      - treish_net
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep 'wazuh-remoted is running' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.5
    container_name: wazuh-agent
    restart: always
    networks:
      - treish_net
    privileged: true
    pid: host
    environment:
      - WAZUH_MANAGER_IP=treishvaam-wazuh-manager
      - WAZUH_MANAGER_SERVER=treishvaam-wazuh-manager
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      wazuh-manager:
        condition: service_healthy

  permission-fixer:
    image: alpine:latest
    container_name: treishvaam-permission-fixer
    networks:
      - treish_net
    user: "root"
    volumes:
      - app_logs:/workspace/logs
      - app_uploads:/workspace/uploads
      - app_sitemaps:/workspace/sitemaps
    command: [ "sh", "-c", "mkdir -p /workspace/logs /workspace/uploads /workspace/sitemaps && chown -R 1000:1000 /workspace/logs /workspace/uploads /workspace/sitemaps && chmod -R 777 /workspace/logs /workspace/uploads /workspace/sitemaps" ]

  backend:
    build:
      context: .
      args:
        - CACHE_BUST=${CACHE_BUST:-1}
    image: ghcr.io/callitask/finance-api:latest
    restart: always
    networks:
      - treish_net
    environment:
      - PROD_DB_URL=${PROD_DB_URL}
      - PROD_DB_USERNAME=${PROD_DB_USERNAME}
      - PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - INTERNAL_API_SECRET_KEY=${INTERNAL_API_SECRET_KEY}
      - CONTENT_SIGNING_KEY=${CONTENT_SIGNING_KEY}
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}
      - MARKET_DATA_API_KEY=${MARKET_DATA_API_KEY}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID}
      - GA4_BIGQUERY_PROJECT_ID=${GA4_BIGQUERY_PROJECT_ID}
      - GA4_BIGQUERY_DATASET_ID=${GA4_BIGQUERY_DATASET_ID}
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_THREAT_KV_NAMESPACE_ID=${CLOUDFLARE_THREAT_KV_NAMESPACE_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=treishvaam-redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_REDIS_HOST=treishvaam-redis
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_ELASTICSEARCH_USERNAME=elastic
      - SPRING_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - APP_PYTHON_SCRIPT_PATH=/app/scripts/market_data_updater.py
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tempo:9411/api/v2/spans
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://backend.treishvaamgroup.com/auth/realms/treishvaam
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/auth/realms/treishvaam/protocol/openid-connect/certs
      - LOGGING_FILE_NAME=/app/logs/application-${HOSTNAME}.log
      - LINKEDIN_TOKEN_ENCRYPTION_KEY=${LINKEDIN_TOKEN_ENCRYPTION_KEY}
      - USER_EMAIL_ENCRYPTION_KEY=${USER_EMAIL_ENCRYPTION_KEY}
      - CONTACT_EMAIL_ENCRYPTION_KEY=${CONTACT_EMAIL_ENCRYPTION_KEY}
      - CONTACT_MESSAGE_ENCRYPTION_KEY=${CONTACT_MESSAGE_ENCRYPTION_KEY}
      - AUDIT_IP_ENCRYPTION_KEY=${AUDIT_IP_ENCRYPTION_KEY}
      - AEGIS_DB_SIGNING_KEY=${AEGIS_DB_SIGNING_KEY}
      - AEGIS_EDGE_SECRET=${AEGIS_EDGE_SECRET}
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms256m
    volumes:
      - ./backend-app.war:/app/app.war
      - ./ga4-credentials.json:/app/ga4-credentials.json
      - ./scripts:/app/scripts
      - app_uploads:/app/uploads
      - app_sitemaps:/app/sitemaps
      - app_logs:/app/logs
    devices:
      - /dev/random:/dev/random
      - /dev/urandom:/dev/urandom
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.5
      rollback_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          memory: 512M
    depends_on:
      treishvaam-db:
        condition: service_healthy
      treishvaam-redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      keycloak:
        condition: service_started
      permission-fixer:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); s.connect((\"localhost\", 8080)); s.close();' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 160s

  nginx:
    image: openresty/openresty:alpine
    container_name: treishvaam-nginx
    restart: always
    networks:
      - treish_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/lua:/etc/nginx/lua:ro
      - app_uploads:/app/uploads
      - app_sitemaps:/app/sitemaps
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/robots.txt || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:2.9.2
    container_name: treishvaam-loki
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.2
    container_name: treishvaam-promtail
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml
      - app_logs:/app/logs
      - /opt/treishvaam/logs:/host-logs:ro
    command: [ "-config.file=/etc/promtail/config.yml" ]
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    container_name: treishvaam-prometheus
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: treishvaam-grafana
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:3001:3000"
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./dashboards:/var/lib/grafana/dashboards
      - ./config/grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerts.yml
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      - prometheus
      - loki
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: treishvaam-tempo
    restart: always
    networks:
      - treish_net
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - ./data/tempo:/tmp/tempo
    deploy:
      resources:
        limits:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: treishvaam-rabbitmq
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_SERVER_DEFINITION_FILE: /etc/rabbitmq/definitions.json
    volumes:
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  backup-service:
    build: ./backup
    container_name: treishvaam-backup
    restart: always
    networks:
      - treish_net
    environment:
      DB_HOST: treishvaam-db
      DB_USER: root
      DB_PASS: ${PROD_DB_PASSWORD}
      DB_NAME: finance_db
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: treishvaam-backups
      MINIO_ACCESS_KEY: ${BACKUP_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      treishvaam-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ps", "aux"]
      interval: 30s
      timeout: 10s
      retries: 3