# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - Core infrastructure definition for the Treishvaam backend ecosystem.
#  *
#  * Scope:
#  * - Manages internal networking, service discovery, and container lifecycles.
#  * - Must never expose internal databases/services publicly (Zero-Trust).
#  *
#  * Critical Dependencies:
#  * - Backend: relies on treishvaam-db, redis, elasticsearch, rabbitmq, keycloak.
#  * - Nginx: Must strictly depend on Keycloak and Backend to prevent 502 Bad Gateways.
#  *
#  * Security Constraints:
#  * - Passwords and keys must strictly use environment variables mapping.
#  * - ALL secrets must be sourced/injected via Cloudflare (CF) or Infiscal. Reliance on local `.env` files is deprecated for production secrets.
#  * - No direct port mapping for internal stateful services (db, redis, elasticsearch).
#  * - Admin UIs (Grafana, RabbitMQ) are mapped strictly to 127.0.0.1 for SSH tunneling access.
#  *
#  * Non-Negotiables:
#  * - Healthchecks must be robust and dictate startup order.
#  *
#  * IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#  * - EDITED (Phase 2 - Security Hardening):
#  * • Added `--requirepass ${REDIS_PASSWORD}` to Redis command and updated healthcheck.
#  * • Injected `SPRING_DATA_REDIS_PASSWORD` into Backend env.
#  * • Upgraded Keycloak image to `quay.io/keycloak/keycloak:25.0.0`.
#  * • Enabled Elasticsearch `xpack.security.enabled=true` and injected `ELASTIC_PASSWORD` and `SPRING_ELASTICSEARCH_USERNAME`/`PASSWORD`.
#  * • Why: Addressed [SEC-01], [SEC-06], and [SEC-09]. Enforce defense-in-depth across the internal Docker bridge network.
#  *
#  * - EDITED (Hotfix - Deployment Stall):
#  * • Modified Redis healthcheck to use `REDISCLI_AUTH` environment variable instead of `-a` flag to prevent warning messages from breaking the `ping` return code.
#  * • Downgraded Backend `depends_on` for Elasticsearch to `service_started`.
#  * • Why: Elasticsearch takes significantly longer to start on its first run when `xpack.security.enabled=true` is toggled. The strict `service_healthy` condition caused a timeout, preventing the backend and Nginx from booting.
#  */

version: '3.8'

networks:
  treish_net:
    driver: bridge

services:
  treishvaam-db:
    image: mariadb:10.6
    container_name: treishvaam-db
    restart: always
    networks:
      - treish_net
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_PASSWORD}
      MYSQL_DATABASE: finance_db
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./config/mariadb:/etc/mysql/conf.d
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: mariadb:10.6
    container_name: treishvaam-keycloak-db
    restart: always
    networks:
      - treish_net
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_PASSWORD}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./data/keycloak-db:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: treishvaam-keycloak
    restart: always
    networks:
      - treish_net
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_URL: https://backend.treishvaamgroup.com/auth
      KC_HOSTNAME_ADMIN_URL: https://backend.treishvaamgroup.com/auth
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      FINANCE_FRONTEND_URL: ${FINANCE_FRONTEND_URL:-https://treishvaamfinance.com}
      FINANCE_FRONTEND_LOCAL_URL: ${FINANCE_FRONTEND_LOCAL_URL:-http://localhost:3000}
    command: start-dev --import-realm
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    depends_on:
      keycloak-db:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: treishvaam-redis
    restart: always
    networks:
      - treish_net
    volumes:
      - ./data/redis:/data
    command: redis-server --save 60 1 --loglevel warning --stop-writes-on-bgsave-error no --requirepass ${REDIS_PASSWORD}
    # Hotfix: Pass auth via env var to prevent "Warning: Using a password with '-a' or '-u' option on the command line interface may not be safe." 
    # which corrupts the expected "PONG" response of the healthcheck.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: treishvaam-minio
    restart: always
    networks:
      - treish_net
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: treishvaam-elastic
    restart: always
    networks:
      - treish_net
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    volumes:
      - ./data/elastic:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD} -s http://localhost:9200/_cluster/health | grep -E -q 'status.*(green|yellow)'" ]
      interval: 20s
      timeout: 10s
      retries: 10

  tunnel:
    image: cloudflare/cloudflared
    container_name: treishvaam-tunnel
    restart: always
    networks:
      - treish_net
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  backend:
    image: ghcr.io/callitask/finance-api:latest
    restart: always
    networks:
      - treish_net
    env_file: .env
    environment:
      - PROD_DB_URL=${PROD_DB_URL}
      - PROD_DB_USERNAME=${PROD_DB_USERNAME}
      - PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - INTERNAL_API_SECRET_KEY=${INTERNAL_API_SECRET_KEY}
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}
      - MARKET_DATA_API_KEY=${MARKET_DATA_API_KEY}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID}
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=treishvaam-redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_ELASTICSEARCH_URIS=http://treishvaam-elastic:9200
      - SPRING_ELASTICSEARCH_USERNAME=elastic
      - SPRING_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - STORAGE_S3_ENDPOINT=http://treishvaam-minio:9000
      - SPRING_RABBITMQ_HOST=treishvaam-rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - APP_PYTHON_SCRIPT_PATH=/app/scripts/market_data_updater.py
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tempo:9411/api/v2/spans
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://backend.treishvaamgroup.com/auth/realms/treishvaam
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/auth/realms/treishvaam/protocol/openid-connect/certs
      - LOGGING_FILE_NAME=/app/logs/application-${HOSTNAME}.log
      - LINKEDIN_TOKEN_ENCRYPTION_KEY=${LINKEDIN_TOKEN_ENCRYPTION_KEY}
    volumes:
      - ./backend-app.war:/app/app.war
      - ./ga4-credentials.json:/app/ga4-credentials.json
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
      - ./sitemaps:/app/sitemaps
      - ./logs:/app/logs
    deploy:
      mode: replicated
      replicas: 2
    depends_on:
      treishvaam-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        # Hotfix: Downgraded to service_started. ES initialization takes time.
        condition: service_started
      rabbitmq:
        condition: service_started
      tempo:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); s.connect((\"localhost\", 8080)); s.close();' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 160s

  nginx:
    image: owasp/modsecurity-crs:nginx
    container_name: treishvaam-nginx
    restart: always
    networks:
      - treish_net
    ports:
      - "80:80"
      - "443:443"
    environment:
      PARANOIA: 1
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/templates/conf.d/default.conf.template
      - ./nginx/modsecurity/whitelist.conf:/etc/nginx/modsecurity/whitelist.conf
      - ./uploads:/app/uploads
      - ./sitemaps:/app/sitemaps
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/robots.txt" ]
      interval: 15s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:2.9.2
    container_name: treishvaam-loki
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.2
    container_name: treishvaam-promtail
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/app/logs
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:latest
    container_name: treishvaam-prometheus
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: treishvaam-grafana
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:3001:3000"
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./dashboards:/var/lib/grafana/dashboards
      - ./config/grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerts.yml
    depends_on:
      - prometheus
      - loki
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: treishvaam-tempo
    restart: always
    networks:
      - treish_net
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - ./data/tempo:/tmp/tempo

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: treishvaam-rabbitmq
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  backup-service:
    build: ./backup
    container_name: treishvaam-backup
    restart: always
    networks:
      - treish_net
    environment:
      DB_HOST: treishvaam-db
      DB_USER: root
      DB_PASS: ${PROD_DB_PASSWORD}
      DB_NAME: finance_db
      S3_ENDPOINT: http://treishvaam-minio:9000
      S3_BUCKET: treishvaam-backups
      MINIO_ACCESS_KEY: ${BACKUP_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      treishvaam-db:
        condition: service_healthy
      minio:
        condition: service_healthy