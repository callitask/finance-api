# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - Core infrastructure definition for the Treishvaam backend ecosystem.
#  *
#  * Scope:
#  * - Manages internal networking, service discovery, and container lifecycles.
#  *
#  * Critical Dependencies:
#  * - Backend: relies on treishvaam-db, redis, elasticsearch, rabbitmq, keycloak, and permission-fixer.
#  * - RabbitMQ: Must be healthy (not just started) for backend to boot successfully.
#  *
#  * Security Constraints:
#  * - Keycloak, Grafana, and RabbitMQ UIs must remain on loopback or private networks, never exposed on 0.0.0.0.
#  * - Database credentials must be mapped dynamically via host env variables.
#  *
#  * IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#  * - EDITED (Hotfix - Broker Crashloop Fix):
#  * • Switched to `RABBITMQ_SERVER_DEFINITION_FILE` variable.
#  * • Added `rabbitmq-diagnostics` healthcheck to prevent backend from connecting to a half-ready broker.
#  * • Upgraded backend `depends_on` to `service_healthy` for RabbitMQ.
#  * • Why: The broker was refusing 'admin' login because the previous definitions file reset vhost permissions. The healthcheck prevents race-condition crashes in the Spring Boot JVM.
#  *
#  * - EDITED (Resource Contention & Memory Hardening Fix):
#  * • Reduced backend replicas from 2 to 1 to prevent initialization race conditions and resource starvation.
#  * • Injected JAVA_TOOL_OPTIONS (-Xmx1024m -Xms512m) to enforce explicit JVM heap memory limits.
#  * • Why: The dual-replica setup running within a restricted VirtualBox VM was triggering the host/guest Linux Out-Of-Memory (OOM) killer due to memory spikes from multiple concurrent backend boots and spawned Python sub-processes. Capping the heap size and consolidating to a single replica ensures stable startup metrics.
#  *
#  * - EDITED (HA Restoration & Fine-Grained Memory Tuning):
#  * • Restored backend replicas to 2.
#  * • Adjusted JAVA_TOOL_OPTIONS to (-Xmx768m -Xms512m).
#  * • Why: To restore high availability while preventing the previous OOM crashes. This JVM tuning, combined with the aggressive OS cache flush added to `auto_deploy.sh`, guarantees sufficient RAM for both Spring contexts and Python ProcessBuilders.
#  *
#  * - EDITED (Phase 2):
#  * • Injected `CONTENT_SIGNING_KEY` environment variable.
#  * • Why: Required for backend `ContentIntegrityService` HMAC digital signatures.
#  *
#  * - EDITED (Phase 4):
#  * • Injected `BACKUP_ENCRYPTION_KEY` into `backup-service`.
#  * • Why: Required to encrypt MariaDB dump files at rest before uploading to off-site MinIO storage.
#  *
#  * - EDITED (Hotfix - BigQuery Config Sync):
#  * • Injected `GA4_BIGQUERY_PROJECT_ID` and `GA4_BIGQUERY_DATASET_ID` into backend service environment.
#  * • Why: Spring Boot crashed with `PlaceholderResolutionException` during startup because the Phase 10 variables in `application-prod.properties` were not mapped through the Docker Compose container boundary from the host's Infisical `.env`.
#  *
#  * - EDITED (AEGIS Phase 1):
#  * • Replaced nginx:alpine with openresty/openresty:alpine.
#  * • Mapped hardware entropy (/dev/random, /dev/urandom) into backend.
#  * • Added aegis-zkp-service, aegis-canary-server, and wazuh-agent placeholders.
#  * • Why: Executing AEGIS Orchestrator Phase 1 for PQC, ZKP auth, and Edge Lua capabilities.
#  *
#  * - EDITED (Fix-Forward: Air-Gapped Runner Support):
#  * • Added `build: .` context to the `backend` service.
#  * • Why: Allows `docker compose up --build` to compile the image locally using the resident `Dockerfile`, permanently bypassing `ghcr.io` registry authentication denials after a system cache prune.
#  *
#  * - EDITED (AEGIS Phase 4 - Edge MTD Sync):
#  * • Injected `CLOUDFLARE_ACCOUNT_ID`, `CLOUDFLARE_THREAT_KV_NAMESPACE_ID`, and `CLOUDFLARE_API_TOKEN` into the backend.
#  * • Why: Enables the backend RabbitMQ consumer to dynamically push malicious IP/JA3 signatures to the Edge KV store for real-time global botnet dropping.
#  *
#  * - EDITED (AEGIS Phase 5 - ZKP Go Ignition):
#  * • Mapped `./aegis/zkp-service` volume and injected `go mod init/run` into the `aegis-zkp-service` command.
#  * • Why: Activates the L3-ZKA microservice listening on 9090, replacing the `sleep infinity` scaffold.
#  *
#  * - EDITED (AEGIS Phase 5 - ZKP Microservice Containerization):
#  * • Converted `aegis-zkp-service` from a raw volume-mapped Golang image to a compiled `build:` target using the zero-trust Dockerfile.
#  * • Applied strict memory bounds (`256M`) via Docker `deploy.resources` to prevent VirtualBox host starvation.
#  * • Added TCP netcat healthcheck for the gRPC 9090 port.
#  * • Why: Enhances Zero-Trust posture by executing a static, compiled binary without shell or source code exposure, officially bringing the L3-ZKA engine online for production routing.
#  *
#  * - EDITED (Hotfix - Envoy Sidecar Resilience):
#  * • Added `restart: always` to the `envoy-sidecar` service.
#  * • Why: The sidecar proxy would exit entirely if the backend container was unreachable during startup because it lacked a restart policy. This prevents silent proxy deaths.
#  *
#  * - EDITED (Hotfix - Init Container for Permissions):
#  * • Added `permission-fixer` ephemeral Alpine container.
#  * • Added `service_completed_successfully` dependency to the `backend` service.
#  * • Why: Replaces unreliable shell-based permission hacks. Guarantees that the strict `root`-owned bind mounts created by Docker daemon are set to `777` *before* the Spring Boot JVM initializes, preventing `java.io.FileNotFoundException` on `/app/logs/backend.json`.
#  *
#  * - DO-NOT-DELETE RULE:
#  * This IMMUTABLE CHANGE HISTORY section must never be deleted,
#  * truncated, rewritten, or regenerated.
#  * Future AI must append only.
#  */

version: '3.8'

networks:
  treish_net:
    driver: bridge

services:
  treishvaam-db:
    image: mariadb:10.6
    container_name: treishvaam-db
    restart: always
    networks:
      - treish_net
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_PASSWORD}
      MYSQL_DATABASE: finance_db
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./config/mariadb/encryption.cnf:/etc/mysql/conf.d/encryption.cnf:ro
    secrets:
      - mariadb_encryption_key
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: mariadb:10.6
    container_name: treishvaam-keycloak-db
    restart: always
    networks:
      - treish_net
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_PASSWORD}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./data/keycloak-db:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: treishvaam-keycloak
    restart: always
    networks:
      - treish_net
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: backend.treishvaamgroup.com
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: keycloak-admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      FINANCE_FRONTEND_URL: ${FINANCE_FRONTEND_URL:-https://treishvaamfinance.com}
      FINANCE_FRONTEND_LOCAL_URL: ${FINANCE_FRONTEND_LOCAL_URL:-http://localhost:3000}
    command: start-dev --import-realm
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    depends_on:
      keycloak-db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: treishvaam-redis
    restart: always
    networks:
      - treish_net
    volumes:
      - ./data/redis:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --stop-writes-on-bgsave-error
      - "no"
      - --protected-mode
      - "yes"
      - --bind
      - 0.0.0.0
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
      - --rename-command
      - MONITOR
      - ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: treishvaam-minio
    restart: always
    networks:
      - treish_net
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: treishvaam-elastic
    restart: always
    networks:
      - treish_net
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    volumes:
      - ./data/elastic:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -u elastic:$$ELASTIC_PASSWORD -s http://localhost:9200/_cluster/health | grep -E -q 'status.*(green|yellow)'" ]
      interval: 20s
      timeout: 10s
      retries: 10

  tunnel:
    image: cloudflare/cloudflared
    container_name: treishvaam-tunnel
    restart: always
    networks:
      - treish_net
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  envoy-sidecar:
    image: envoyproxy/envoy:v1.29-latest
    container_name: treishvaam-envoy
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - backend

  aegis-zkp-service:
    build: ./aegis/zkp-service
    image: treishvaam/aegis-zkp-service:latest
    container_name: aegis-zkp-service
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9090"]
      interval: 15s
      timeout: 5s
      retries: 5

  aegis-canary-server:
    image: thinkst/canarytokens:latest
    container_name: aegis-canary-server
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:8089:80"

  wazuh-agent:
    image: wazuh/wazuh-agent:4.7.3
    container_name: wazuh-agent
    restart: always
    networks:
      - treish_net
    privileged: true
    pid: host
    environment:
      - WAZUH_MANAGER=127.0.0.1

  permission-fixer:
    image: alpine:latest
    container_name: treishvaam-permission-fixer
    networks:
      - treish_net
    user: "root"
    volumes:
      - ./logs:/workspace/logs
      - ./uploads:/workspace/uploads
      - ./sitemaps:/workspace/sitemaps
    command: sh -c "mkdir -p /workspace/logs /workspace/uploads /workspace/sitemaps && chmod -R 777 /workspace/logs /workspace/uploads /workspace/sitemaps"

  backend:
    build: .
    image: ghcr.io/callitask/finance-api:latest
    restart: always
    networks:
      - treish_net
    env_file: .env
    environment:
      - PROD_DB_URL=${PROD_DB_URL}
      - PROD_DB_USERNAME=${PROD_DB_USERNAME}
      - PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - INTERNAL_API_SECRET_KEY=${INTERNAL_API_SECRET_KEY}
      - CONTENT_SIGNING_KEY=${CONTENT_SIGNING_KEY}
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}
      - MARKET_DATA_API_KEY=${MARKET_DATA_API_KEY}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID}
      - GA4_BIGQUERY_PROJECT_ID=${GA4_BIGQUERY_PROJECT_ID}
      - GA4_BIGQUERY_DATASET_ID=${GA4_BIGQUERY_DATASET_ID}
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_THREAT_KV_NAMESPACE_ID=${CLOUDFLARE_THREAT_KV_NAMESPACE_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=treishvaam-redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_ELASTICSEARCH_URIS=http://treishvaam-elastic:9200
      - SPRING_ELASTICSEARCH_USERNAME=elastic
      - SPRING_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - STORAGE_S3_ENDPOINT=http://treishvaam-minio:9000
      - SPRING_RABBITMQ_HOST=treishvaam-rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - APP_PYTHON_SCRIPT_PATH=/app/scripts/market_data_updater.py
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tempo:9411/api/v2/spans
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://backend.treishvaamgroup.com/auth/realms/treishvaam
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/auth/realms/treishvaam/protocol/openid-connect/certs
      - LOGGING_FILE_NAME=/app/logs/application-${HOSTNAME}.log
      - LINKEDIN_TOKEN_ENCRYPTION_KEY=${LINKEDIN_TOKEN_ENCRYPTION_KEY}
      - USER_EMAIL_ENCRYPTION_KEY=${USER_EMAIL_ENCRYPTION_KEY}
      - CONTACT_EMAIL_ENCRYPTION_KEY=${CONTACT_EMAIL_ENCRYPTION_KEY}
      - CONTACT_MESSAGE_ENCRYPTION_KEY=${CONTACT_MESSAGE_ENCRYPTION_KEY}
      - AUDIT_IP_ENCRYPTION_KEY=${AUDIT_IP_ENCRYPTION_KEY}
      - JAVA_TOOL_OPTIONS=-Xmx768m -Xms512m
    volumes:
      - ./backend-app.war:/app/app.war
      - ./ga4-credentials.json:/app/ga4-credentials.json
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
      - ./sitemaps:/app/sitemaps
      - ./logs:/app/logs
    devices:
      - /dev/random:/dev/random
      - /dev/urandom:/dev/urandom
    deploy:
      mode: replicated
      replicas: 2
    depends_on:
      treishvaam-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      keycloak:
        condition: service_started
      permission-fixer:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); s.connect((\"localhost\", 8080)); s.close();' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 160s

  nginx:
    image: openresty/openresty:alpine
    container_name: treishvaam-nginx
    restart: always
    networks:
      - treish_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/lua:/etc/nginx/lua:ro
      - ./uploads:/app/uploads
      - ./sitemaps:/app/sitemaps
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/robots.txt" ]
      interval: 15s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:2.9.2
    container_name: treishvaam-loki
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.2
    container_name: treishvaam-promtail
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/app/logs
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:latest
    container_name: treishvaam-prometheus
    restart: always
    networks:
      - treish_net
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: treishvaam-grafana
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:3001:3000"
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./dashboards:/var/lib/grafana/dashboards
      - ./config/grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerts.yml
    depends_on:
      - prometheus
      - loki
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: treishvaam-tempo
    restart: always
    networks:
      - treish_net
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - ./data/tempo:/tmp/tempo

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: treishvaam-rabbitmq
    restart: always
    networks:
      - treish_net
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # Enterprise Load Strategy: Modern env var for definitions
      RABBITMQ_SERVER_DEFINITION_FILE: /etc/rabbitmq/definitions.json
    volumes:
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  backup-service:
    build: ./backup
    container_name: treishvaam-backup
    restart: always
    networks:
      - treish_net
    environment:
      DB_HOST: treishvaam-db
      DB_USER: root
      DB_PASS: ${PROD_DB_PASSWORD}
      DB_NAME: finance_db
      S3_ENDPOINT: http://treishvaam-minio:9000
      S3_BUCKET: treishvaam-backups
      MINIO_ACCESS_KEY: ${BACKUP_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    depends_on:
      treishvaam-db:
        condition: service_healthy
      minio:
        condition: service_healthy

secrets:
  mariadb_encryption_key:
    environment: "MARIADB_ENCRYPTION_KEY"