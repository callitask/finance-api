# ==============================================================================
# AI-CONTEXT:
#
# Purpose:
#   - Zero-State Ignition (ZSI) playbook. Bootstraps a naked Ubuntu VM to an Enterprise production-ready state.
#
# Scope:
#   - OS-level configurations (NTP, Swap, Docker limits, .env.template, Runner hooks, Telemetry limits).
#   - Must NEVER deploy application containers directly. It only prepares the host for Engine A (GitHub Actions).
#
# Critical Dependencies:
#   - Ubuntu 22.04 LTS (or compatible apt-based system)
#   - actions.runner daemon (must be installed by admin post-ignition)
#
# Security Constraints:
#   - Infisical Vault tokens MUST be injected securely.
#   - NTP Boot Lock is mandatory to prevent OAuth token drift.
#
# Non-Negotiables:
#   - Must execute successfully without user interaction.
#
# IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#   - ADDED:
#     • Initial Ansible playbook for Zero-State Ignition.
#     • Prevents the Bootstrap Paradox by laying down the .env.template, Docker limits, Swap, and NTP Boot Lock.
#     • Date/Phase: 2026-06-16
#
#   - EDITED:
#     • Added `Restart=always` and `RestartSec=10` to the Tier-1 systemd override (Task 7).
#     • Reason: VirtualBox bridged networking drops TCP connections (and WebSockets) during mass Docker container recreation. The default GitHub runner dies silently on network hangups. This guarantees autonomous resurrection within 10 seconds of any network shock, permanently stabilizing the CI/CD pipeline.
#
#   - ADDED (Engine B Telemetry Integration):
#     • Added Logrotate configuration for `deploy_pipeline.log` and `deploy_telemetry.ndjson` with `su root root` constraint.
#     • Pre-created `/opt/treishvaam/logs` directory and `deploy_telemetry.ndjson` file with correct 755/644 permissions.
#     • Reason: Eliminates configuration drift by defining observability boundaries in IaC. Bypasses logrotate insecure parent directory errors natively.
#
#   - EDITED (CI/CD Remediation - Ansible Bootstrap Gap & Hardened OS Limits):
#     • Added Docker CE, Docker Compose v2, and Infisical CLI installation blocks.
#     • Replaced plaintext `INFISICAL_CLIENT_SECRET` with Ansible Vault variable `{{ infisical_client_secret }}`.
#     • Enabled `swapaccount=1` in GRUB to allow Docker cgroups to utilize host swap under memory pressure.
#     • Configured `/etc/sudoers.d/treishvaam-deploy` allowing `vboxuser` passwordless execution of Engine B infrastructure commands.
#     • Hardcoded persistent `vm.max_map_count=262144` specifically to prevent Elasticsearch boot failure.
#     • Replaced hardcoded runner service path with dynamic systemctl detection for auto-heal override.
#
#   - EDITED (Stateless Auth Alignment - 2026-06-30):
#     • Verified Vault Seed injection matrix against the new Stateless JWT Infisical architecture.
#     • Reason: Ensures Zero-State Ignition (ZSI) natively supports the `engine-b-runner` Machine Identity credentials without polluting the template with legacy session parameters.
#
#   - EDITED (Smart System Ghost Eradication Alignment - 2026-06-30):
#     • Validated playbook against the Phase 3 Orchestrator (Engine B) daemon reconciliation upgrades.
#     • Reason: A "Smart System" architecture dictates that Engine A (Ansible ZSI) strictly handles pristine OS-level bootstrapping, while Engine B exclusively manages zero-downtime daemon states (including Dead/Created ghost purges). This separation of concerns prevents IaC from colliding with Docker's internal state machine.
#
#   - EDITED (CI/CD Remediation - Phase 4 Network & Observability Hardening):
#     • Injected UFW firewall configuration to natively allow ports 22, 80, 443 and deny all others.
#     • Injected observability aliases (watchdeploy, detstatus) into the vboxuser .bashrc.
#     • Reason: Completes the final gaps from the CI/CD remediation report. Secures the host from unauthorized port access and provides zero-friction CLI observability tools for incident response without typing long paths.
#
#   - EDITED (Autonomic Mount Recovery Engine):
#     • Injected `NOPASSWD` sudo execution rights for `/opt/treishvaam/scripts/kernel-mount-recovery.sh` into `treishvaam-deploy` sudoers config.
#     • Reason: Permits Engine B (`auto_deploy.sh`) to invoke root-level lazy unmounts and clear Split-Brain ghost containers autonomously without dropping the engineer's SSH session or granting blanket root access to `vboxuser`.
# ==============================================================================

- name: Treishvaam Zero-State Ignition (ZSI)
  hosts: all
  become: yes
  vars:
    project_dir: "/opt/treishvaam"
    github_runner_version: "2.335.1"
    
  handlers:
    - name: Update GRUB
      shell: update-grub

  tasks:
    - name: 1. Configure Monotonic Clock (NTP Boot Lock)
      shell: |
        timedatectl set-ntp true
        systemctl enable --now systemd-timesyncd
      
    - name: 2. Install Base Dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - jq
          - uuid-runtime
          - git
        state: present
        update_cache: yes

    - name: 2.1 Install Docker CE and Docker Compose v2
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
        apt-get update -qq
        apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-compose-plugin
        usermod -aG docker vboxuser
        systemctl enable --now docker
      args:
        creates: /usr/bin/docker

    - name: 2.2 Install Infisical CLI
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | bash
        apt-get install -y infisical
      args:
        creates: /usr/bin/infisical

    - name: 2.3 Enable Docker Swap Accounting in Kernel
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="cgroup_enable=memory swapaccount=1"'
      notify: Update GRUB

    - name: 2.4 Configure Sudoers for Deployment Commands
      copy:
        dest: /etc/sudoers.d/treishvaam-deploy
        mode: '0440'
        validate: 'visudo -cf %s'
        content: |
          vboxuser ALL=(ALL) NOPASSWD: /usr/bin/timedatectl set-ntp true
          vboxuser ALL=(ALL) NOPASSWD: /usr/bin/tee /proc/sys/vm/drop_caches
          vboxuser ALL=(ALL) NOPASSWD: /usr/sbin/sysctl -w vm.max_map_count=262144
          vboxuser ALL=(ALL) NOPASSWD: /usr/sbin/sysctl -w net.ipv6.conf.all.disable_ipv6=1
          vboxuser ALL=(ALL) NOPASSWD: /usr/bin/sync
          vboxuser ALL=(ALL) NOPASSWD: /usr/bin/chown *
          vboxuser ALL=(ALL) NOPASSWD: /opt/treishvaam/scripts/kernel-mount-recovery.sh

    - name: 2.5 Set vm.max_map_count persistently for Elasticsearch
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        sysctl_file: /etc/sysctl.d/99-treishvaam.conf

    - name: 3. Configure Docker Daemon Log Rotation
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "50m",
              "max-file": "3"
            }
          }

    - name: 4. Ensure Permanent Swap Space (Fstab)
      shell: |
        fallocate -l 4G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    - name: 5.1 Initialize Project Directory Structure
      file:
        path: "{{ item }}"
        state: directory
        owner: 1000
        group: 1000
        mode: '0755'
      loop:
        - "{{ project_dir }}"
        - "{{ project_dir }}/scripts"
        - "{{ project_dir }}/logs"
        - "{{ project_dir }}/data/mariadb"
        - "{{ project_dir }}/data/keycloak-db"
        - "{{ project_dir }}/config"
        - "/backup"

    - name: 6. Inject Permanent Infisical Credentials (Secure Vault Mapping)
      copy:
        dest: "{{ project_dir }}/.env.template"
        owner: 1000
        group: 1000
        mode: '0600'
        content: |
          # --- INFISICAL CREDENTIALS ---
          INFISICAL_URL=https://app.infisical.com
          INFISICAL_PROJECT_ID={{ infisical_project_id }}
          INFISICAL_CLIENT_ID={{ infisical_client_id }}
          INFISICAL_CLIENT_SECRET={{ infisical_client_secret }}
          SPRING_PROFILES_ACTIVE=prod

    - name: 7. Apply Tier-1 Runner Time-Sync & Auto-Heal Override (Dynamic Name)
      shell: |
        RUNNER_SERVICE=$(systemctl list-units --type=service --all | grep actions.runner | awk '{print $1}' | head -1)
        if [ -z "$RUNNER_SERVICE" ]; then
          echo "WARNING: GitHub Actions runner service not found yet. This task must be re-run after runner registration."
          exit 0
        fi
        OVERRIDE_DIR="/etc/systemd/system/${RUNNER_SERVICE}.d"
        mkdir -p "$OVERRIDE_DIR"
        cat > "${OVERRIDE_DIR}/override.conf" << 'EOF'
        [Unit]
        After=time-sync.target
        Wants=time-sync.target

        [Service]
        Restart=always
        RestartSec=10
        EOF
        systemctl daemon-reload
      ignore_errors: yes

    - name: 8. Configure Engine B Telemetry Logrotate (Anti-Log-Bomb)
      copy:
        dest: /etc/logrotate.d/treishvaam-deploy
        mode: '0644'
        content: |
          /opt/treishvaam/deploy_pipeline.log {
              su root root
              daily
              rotate 30
              maxsize 50M
              compress
              delaycompress
              copytruncate
              missingok
              notifempty
              create 644 root root
          }

          /opt/treishvaam/logs/deploy_telemetry.ndjson {
              su root root
              daily
              rotate 30
              maxsize 20M
              compress
              delaycompress
              copytruncate
              missingok
              notifempty
              create 644 root root
          }

    - name: 8.1 Configure UFW Firewall (Allow 22, 80, 443)
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '22'
        - '80'
        - '443'

    - name: 8.2 Enable UFW with Default Deny
      ufw:
        state: enabled
        policy: deny

    - name: 8.3 Inject Observability Aliases into ~/.bashrc
      blockinfile:
        path: /home/vboxuser/.bashrc
        owner: vboxuser
        group: vboxuser
        marker: "# {mark} TREISHVAAM OBSERVABILITY ALIASES"
        content: |
          alias watchdeploy='bash /opt/treishvaam/scripts/watch-deployment.sh'
          alias detstatus='bash /opt/treishvaam/scripts/deployment-health-report.sh'

    - name: 9. Security Notice & Next Steps
      debug:
        msg: "ZSI Complete. ACTION REQUIRED: 1) Reboot server to apply swapaccount. 2) Register GitHub Runner. 3) Re-run this playbook to apply the Runner override."