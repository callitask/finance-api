# OCI Master Node — Ansible inventory (OCI Migration Phase 1, 2026-08-23)
#
# Fill ansible_host with the instance public IP (terraform output
# master_node_public_ip). SSH goes through the OCI Bastion (see
# ../terraform/BASTION-NOTE.md) — either export ANSIBLE_SSH_ARGS with the
# ProxyJump pattern below, or put the ProxyJump in ~/.ssh/config under the
# alias treishvaam-oci and use ansible_host=treishvaam-oci.
#
# The boot user on Canonical Ubuntu OCI images is `ubuntu` (cloud-init).
# The vboxuser deploy account is created by oci-bootstrap-overlay.yml,
# because setup-server.yml and Engine A's systemd-run handoff
# (--uid=vboxuser) both expect it by name.

[treishvaam_oci]
treishvaam-oci-primary ansible_host=<MASTER_NODE_PUBLIC_IP> ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3

# Example bastion hop (session values come from a live bastion session):
#   export ANSIBLE_SSH_ARGS='-o ProxyCommand="ssh -W %h:%p -p <session-port> oci_bastion@<bastion-host>"'
