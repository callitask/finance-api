# /**
#  * AI-CONTEXT:
#  *
#  * Purpose:
#  * - Core configuration for Grafana Loki (Log Aggregation System).
#  *
#  * Scope:
#  * - Defines storage drivers, retention, and ingestion limits for all container logs.
#  *
#  * IMMUTABLE CHANGE HISTORY (DO NOT DELETE):
#  * - EDITED (Enterprise Ingestion Limits):
#  * • Added `limits_config` block with `ingestion_rate_mb: 50` and `ingestion_burst_size_mb: 100`.
#  * • Reason: Loki's default limits (4MB/s) were rejecting logs with `429 Too Many Requests` during rapid infrastructure reboots when Promtail attempted to upload the historical backlog all at once.
#  */

auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100