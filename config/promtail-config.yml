server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
- job_name: system
  static_configs:
  - targets:
      - localhost
    labels:
      job: varlogs
      __path__: /app/logs/*.json

- job_name: engine-b-deploy
  static_configs:
    - targets:
        - localhost
      labels:
        job: engine-b-deploy
        __path__: /host-logs/deploy_telemetry.ndjson

  pipeline_stages:
    - json:
        expressions:
          timestamp: timestamp
          run_id:    run_id
          phase:     phase
          status:    status
          message:   message

    - timestamp:
        source: timestamp
        format: RFC3339

    - labels:
        run_id:  ""
        phase:   ""
        status:  ""

    - output:
        source: message